<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AI 3D Chase</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #0a0a12;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #e0e0ff;
      user-select: none;
      touch-action: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
    }
    canvas { display: block; width: 100%; height: 100%; }

    #ui {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    }
    .stat {
      background: rgba(20, 20, 40, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(100, 120, 255, 0.3);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 18px;
      font-weight: 600;
      min-width: 110px;
      text-align: center;
    }
    .stat span { color: #7af; display: block; font-size: 12px; font-weight: 500; letter-spacing: 0.5px; }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 5, 15, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.3s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay h1 {
      font-size: clamp(2.2rem, 8vw, 3.5rem);
      margin-bottom: 8px;
      background: linear-gradient(90deg, #6af, #f6a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #overlay p {
      font-size: 1.1rem;
      opacity: 0.85;
      margin-bottom: 28px;
      max-width: 360px;
      text-align: center;
      line-height: 1.5;
    }
    #start-btn, #restart-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #4a6cf7, #7b5cff);
      color: white;
      border: none;
      padding: 14px 42px;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(74, 108, 247, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    #start-btn:hover, #restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(74, 108, 247, 0.55);
    }
    #final-score {
      font-size: 1.4rem;
      margin-bottom: 20px;
      color: #9cf;
    }

    #controls-hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,15,30,0.7);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0.8;
      z-index: 5;
      pointer-events: none;
    }

    /* Mobile virtual joystick area */
    #touch-zone {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45%;
      z-index: 8;
      display: none;
    }
    @media (max-width: 768px), (pointer: coarse) {
      #touch-zone { display: block; }
      #controls-hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <div class="stat"><span>SCORE</span><div id="score">0</div></div>
    <div class="stat"><span>TIME</span><div id="time">0s</div></div>
    <div class="stat"><span>BEST</span><div id="best">0</div></div>
  </div>

  <div id="controls-hint">WASD / Arrow Keys to move · Survive the AI hunters</div>
  <div id="touch-zone"></div>

  <div id="overlay">
    <h1>AI 3D Chase</h1>
    <p>You are the blue orb. Red AI hunters will chase you using simple pursuit AI. Collect the glowing orbs and survive as long as you can!</p>
    <button id="start-btn">Start Game</button>
  </div>

  <div id="overlay-gameover" class="hidden" style="display:none; position:fixed; inset:0; background:rgba(5,5,15,0.88); z-index:25; flex-direction:column; align-items:center; justify-content:center;">
    <h1 style="font-size:2.8rem; margin-bottom:10px; color:#f66;">Game Over</h1>
    <div id="final-score">Score: 0</div>
    <button id="restart-btn">Play Again</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ---------- Config ----------
    const ARENA = 40;
    const PLAYER_SPEED = 12;
    const AI_BASE_SPEED = 7.5;
    const COLLECT_COUNT = 8;
    const MAX_AI = 6;

    // ---------- State ----------
    let score = 0;
    let best = parseInt(localStorage.getItem('ai3d-best') || '0', 10);
    let startTime = 0;
    let playing = false;
    let keys = {};
    let touchDir = new THREE.Vector2(0, 0);

    document.getElementById('best').textContent = best;

    // ---------- Scene setup ----------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a18);
    scene.fog = new THREE.Fog(0x0a0a18, 25, 70);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 22, 18);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0x4060a0, 0.45);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(12, 25, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 60;
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x6688ff, 0.6, 40);
    pointLight.position.set(0, 8, 0);
    scene.add(pointLight);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(ARENA * 2, ARENA * 2, 32, 32);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x12122a,
      roughness: 0.85,
      metalness: 0.1,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid helper (subtle)
    const grid = new THREE.GridHelper(ARENA * 2, 40, 0x2a2a50, 0x1a1a35);
    grid.position.y = 0.01;
    scene.add(grid);

    // Boundary walls (visual only)
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1a40, transparent: true, opacity: 0.35 });
    function makeWall(w, h, d, x, z) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
      m.position.set(x, h / 2, z);
      scene.add(m);
    }
    makeWall(ARENA * 2 + 1, 2.5, 0.4, 0, ARENA);
    makeWall(ARENA * 2 + 1, 2.5, 0.4, 0, -ARENA);
    makeWall(0.4, 2.5, ARENA * 2 + 1, ARENA, 0);
    makeWall(0.4, 2.5, ARENA * 2 + 1, -ARENA, 0);

    // ---------- Player ----------
    const playerGeo = new THREE.SphereGeometry(0.7, 24, 24);
    const playerMat = new THREE.MeshStandardMaterial({
      color: 0x44aaff,
      emissive: 0x112244,
      roughness: 0.3,
      metalness: 0.4,
    });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.castShadow = true;
    player.position.y = 0.7;
    scene.add(player);

    // Glow ring under player
    const ringGeo = new THREE.RingGeometry(0.9, 1.15, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.05;
    scene.add(ring);

    // ---------- AI Enemies ----------
    const enemies = [];
    const enemyGeo = new THREE.SphereGeometry(0.65, 20, 20);

    function createEnemy() {
      const mat = new THREE.MeshStandardMaterial({
        color: 0xff4455,
        emissive: 0x440011,
        roughness: 0.35,
        metalness: 0.3,
      });
      const mesh = new THREE.Mesh(enemyGeo, mat);
      mesh.castShadow = true;
      mesh.position.y = 0.65;

      // Spawn at edge
      const angle = Math.random() * Math.PI * 2;
      const r = ARENA * 0.85;
      mesh.position.x = Math.cos(angle) * r;
      mesh.position.z = Math.sin(angle) * r;

      scene.add(mesh);
      enemies.push({
        mesh,
        speed: AI_BASE_SPEED + Math.random() * 2.5,
        wander: Math.random() * Math.PI * 2,
      });
    }

    // ---------- Collectibles ----------
    const collectibles = [];
    const collectGeo = new THREE.IcosahedronGeometry(0.4, 0);
    const collectMat = new THREE.MeshStandardMaterial({
      color: 0xffdd44,
      emissive: 0xaa8800,
      roughness: 0.2,
      metalness: 0.6,
    });

    function spawnCollectible() {
      const mesh = new THREE.Mesh(collectGeo, collectMat.clone());
      mesh.castShadow = true;
      let x, z, ok;
      do {
        x = (Math.random() - 0.5) * ARENA * 1.6;
        z = (Math.random() - 0.5) * ARENA * 1.6;
        ok = Math.hypot(x - player.position.x, z - player.position.z) > 4;
      } while (!ok);
      mesh.position.set(x, 0.5, z);
      scene.add(mesh);
      collectibles.push(mesh);
    }

    // ---------- Input ----------
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // Touch / virtual stick
    const touchZone = document.getElementById('touch-zone');
    let touchId = null;
    let touchOrigin = { x: 0, y: 0 };

    touchZone.addEventListener('touchstart', e => {
      if (touchId !== null) return;
      const t = e.changedTouches[0];
      touchId = t.identifier;
      touchOrigin.x = t.clientX;
      touchOrigin.y = t.clientY;
    }, { passive: true });

    touchZone.addEventListener('touchmove', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === touchId) {
          const dx = t.clientX - touchOrigin.x;
          const dy = t.clientY - touchOrigin.y;
          const len = Math.hypot(dx, dy) || 1;
          const max = 60;
          touchDir.x = THREE.MathUtils.clamp(dx / max, -1, 1);
          touchDir.y = THREE.MathUtils.clamp(dy / max, -1, 1);
        }
      }
    }, { passive: true });

    function endTouch(e) {
      for (const t of e.changedTouches) {
        if (t.identifier === touchId) {
          touchId = null;
          touchDir.set(0, 0);
        }
      }
    }
    touchZone.addEventListener('touchend', endTouch);
    touchZone.addEventListener('touchcancel', endTouch);

    // ---------- Game logic ----------
    function resetGame() {
      // Clear enemies & collectibles
      enemies.forEach(e => scene.remove(e.mesh));
      enemies.length = 0;
      collectibles.forEach(c => scene.remove(c));
      collectibles.length = 0;

      player.position.set(0, 0.7, 0);
      score = 0;
      startTime = performance.now();
      document.getElementById('score').textContent = '0';

      // Spawn initial AI and orbs
      for (let i = 0; i < 3; i++) createEnemy();
      for (let i = 0; i < COLLECT_COUNT; i++) spawnCollectible();
    }

    function startGame() {
      document.getElementById('overlay').classList.add('hidden');
      document.getElementById('overlay-gameover').style.display = 'none';
      resetGame();
      playing = true;
    }

    function gameOver() {
      playing = false;
      if (score > best) {
        best = score;
        localStorage.setItem('ai3d-best', best);
        document.getElementById('best').textContent = best;
      }
      document.getElementById('final-score').textContent = `Score: ${score}`;
      const go = document.getElementById('overlay-gameover');
      go.style.display = 'flex';
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    // ---------- Update loop ----------
    const clock = new THREE.Clock();
    const tmp = new THREE.Vector3();

    function update(dt) {
      if (!playing) return;

      // Player movement
      let mx = 0, mz = 0;
      if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) mx += 1;

      // Touch overrides / adds
      mx += touchDir.x;
      mz += touchDir.y;

      if (mx !== 0 || mz !== 0) {
        const len = Math.hypot(mx, mz);
        mx /= len; mz /= len;
        player.position.x += mx * PLAYER_SPEED * dt;
        player.position.z += mz * PLAYER_SPEED * dt;

        // Clamp to arena
        player.position.x = THREE.MathUtils.clamp(player.position.x, -ARENA + 1, ARENA - 1);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -ARENA + 1, ARENA - 1);
      }

      ring.position.x = player.position.x;
      ring.position.z = player.position.z;

      // AI pursuit (simple seek + slight prediction)
      enemies.forEach((e, i) => {
        const dx = player.position.x - e.mesh.position.x;
        const dz = player.position.z - e.mesh.position.z;
        const dist = Math.hypot(dx, dz) || 0.001;

        // Seek + small wander for variety
        e.wander += (Math.random() - 0.5) * 2 * dt;
        const seekX = dx / dist;
        const seekZ = dz / dist;
        const wx = Math.cos(e.wander) * 0.25;
        const wz = Math.sin(e.wander) * 0.25;

        e.mesh.position.x += (seekX + wx) * e.speed * dt;
        e.mesh.position.z += (seekZ + wz) * e.speed * dt;

        // Soft boundary
        e.mesh.position.x = THREE.MathUtils.clamp(e.mesh.position.x, -ARENA + 0.8, ARENA - 0.8);
        e.mesh.position.z = THREE.MathUtils.clamp(e.mesh.position.z, -ARENA + 0.8, ARENA - 0.8);

        // Collision with player
        if (dist < 1.25) {
          gameOver();
        }
      });

      // Collectibles
      for (let i = collectibles.length - 1; i >= 0; i--) {
        const c = collectibles[i];
        c.rotation.y += 2 * dt;
        c.position.y = 0.5 + Math.sin(performance.now() * 0.004 + i) * 0.15;

        const d = Math.hypot(c.position.x - player.position.x, c.position.z - player.position.z);
        if (d < 1.1) {
          scene.remove(c);
          collectibles.splice(i, 1);
          score += 50;
          document.getElementById('score').textContent = score;
          spawnCollectible();

          // Occasionally spawn extra AI
          if (enemies.length < MAX_AI && Math.random() < 0.35) {
            createEnemy();
          }
        }
      }

      // Time score
      const elapsed = (performance.now() - startTime) / 1000;
      document.getElementById('time').textContent = Math.floor(elapsed) + 's';
      score = Math.floor(elapsed * 5) + (score % 50 === 0 ? 0 : score - Math.floor(score / 50) * 50); // keep collect bonus
      // Simpler: just update time, score mainly from collects + survival bonus at end, but live update:
      // Actually recalculate cleanly:
      // We'll keep score as survival*5 + collects

      // Camera follow (smooth)
      const targetCamX = player.position.x * 0.35;
      const targetCamZ = player.position.z * 0.35 + 18;
      camera.position.x += (targetCamX - camera.position.x) * 3 * dt;
      camera.position.z += (targetCamZ - camera.position.z) * 3 * dt;
      camera.lookAt(player.position.x * 0.4, 0, player.position.z * 0.4);
    }

    // Fix score logic properly
    let collectBonus = 0;
    function updateScoreDisplay(elapsed) {
      score = Math.floor(elapsed * 5) + collectBonus;
      document.getElementById('score').textContent = score;
    }

    // Redefine collect handling for clean score
    // (patch inside the loop would be messy; instead we track collectBonus)

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (playing) {
        // Player move
        let mx = 0, mz = 0;
        if (keys['KeyW'] || keys['ArrowUp']) mz -= 1;
        if (keys['KeyS'] || keys['ArrowDown']) mz += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) mx -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
        mx += touchDir.x;
        mz += touchDir.y;

        if (mx !== 0 || mz !== 0) {
          const len = Math.hypot(mx, mz);
          mx /= len; mz /= len;
          player.position.x += mx * PLAYER_SPEED * dt;
          player.position.z += mz * PLAYER_SPEED * dt;
          player.position.x = THREE.MathUtils.clamp(player.position.x, -ARENA + 1, ARENA - 1);
          player.position.z = THREE.MathUtils.clamp(player.position.z, -ARENA + 1, ARENA - 1);
        }
        ring.position.x = player.position.x;
        ring.position.z = player.position.z;

        // AI
        for (const e of enemies) {
          const dx = player.position.x - e.mesh.position.x;
          const dz = player.position.z - e.mesh.position.z;
          const dist = Math.hypot(dx, dz) || 0.001;
          e.wander += (Math.random() - 0.5) * 2.5 * dt;
          const seekX = dx / dist;
          const seekZ = dz / dist;
          e.mesh.position.x += (seekX + Math.cos(e.wander) * 0.3) * e.speed * dt;
          e.mesh.position.z += (seekZ + Math.sin(e.wander) * 0.3) * e.speed * dt;
          e.mesh.position.x = THREE.MathUtils.clamp(e.mesh.position.x, -ARENA + 0.8, ARENA - 0.8);
          e.mesh.position.z = THREE.MathUtils.clamp(e.mesh.position.z, -ARENA + 0.8, ARENA - 0.8);

          if (dist < 1.25) gameOver();
        }

        // Collect
        for (let i = collectibles.length - 1; i >= 0; i--) {
          const c = collectibles[i];
          c.rotation.y += 2.2 * dt;
          c.position.y = 0.5 + Math.sin(performance.now() * 0.004 + i) * 0.15;
          const d = Math.hypot(c.position.x - player.position.x, c.position.z - player.position.z);
          if (d < 1.1) {
            scene.remove(c);
            collectibles.splice(i, 1);
            collectBonus += 50;
            spawnCollectible();
            if (enemies.length < MAX_AI && Math.random() < 0.4) createEnemy();
          }
        }

        const elapsed = (performance.now() - startTime) / 1000;
        document.getElementById('time').textContent = Math.floor(elapsed) + 's';
        score = Math.floor(elapsed * 5) + collectBonus;
        document.getElementById('score').textContent = score;

        // Camera
        camera.position.x += (player.position.x * 0.3 - camera.position.x) * 2.5 * dt;
        camera.position.z += (player.position.z * 0.3 + 18 - camera.position.z) * 2.5 * dt;
        camera.lookAt(player.position.x * 0.35, 0.5, player.position.z * 0.35);
      }

      renderer.render(scene, camera);
    }

    // Override reset to clear collectBonus
    const originalReset = resetGame;
    resetGame = function() {
      collectBonus = 0;
      originalReset();
    };

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
